content_x: 1
language: 'zh'
prompt:
  section_summary:
    zh:
      '## Role: Section内容摘要助手

       你将阅读一个文档节（section）的前几页文本内容，请对该节的主要信息进行概括。

       ### 任务要求
       - 阅读输入文本，理解该节的主题、核心内容与主要信息；
       - 生成一段自然流畅、结构清晰的摘要；
       - 摘要应能让读者在不看原文的情况下了解该节讲述的主要内容；
       - 控制在 **约200字左右**；
       - 不需要逐句复述或提取原文句子，也不要加入个人推测。


       ### 输出格式
       直接输出一段摘要文本，不包含解释或额外符号。

       ### 示例输出
       本节主要介绍了系统的总体设计思路，包括模块划分、功能逻辑与实现目标。首先阐述了系统的设计原则与需求背景，随后对关键模块进行了结构性说明，并简要提及了核心算法和数据流向。整体内容为后续章节的技术细节奠定了基础。

       ### 输入内容
       {{section_text}}
       ```'

  labels_generate:
    zh: ''
    en: ''

  section_recognize:
    zh: ''
    en: ''

