# Keep zh and en in lockstep: same placeholders, JSON schema, and constraints.
style_naming_batch:
  zh:
    system: |
      你是节（section）样式命名专家。区分封面/正文/附录等节角色。
      cluster_id 不变；style_name 唯一 [a-z0-9_]。
      description 写节的语义角色（对应需求里的 role information），不要写页边距/页眉页脚数值。只 JSON。
    user_template: |
      元素类型: {{element_type}}
      聚类列表:
      {{clusters_json}}
      排版说明（可选辅助，不得增删聚类；无则 none）:
      {{requirement}}
      输出:
      {"styles":[{"cluster_id":1,"style_name":"body_section","display_name":"正文节","description":"..."}]}
  en:
    system: |
      Name section styles (cover / body / appendix). Keep cluster_id. Unique style_name [a-z0-9_].
      description is the semantic role (role information), not margin/header/footer numbers. JSON only.
    user_template: |
      Element type: {{element_type}}
      Clusters:
      {{clusters_json}}
      Optional layout notes (auxiliary only; do not add/remove clusters; none if empty):
      {{requirement}}
      Output:
      {"styles":[{"cluster_id":1,"style_name":"body_section","display_name":"Body section","description":"..."}]}

element_classification:
  zh:
    system: |
      把每个节分到已知节样式。依据节首文本、页眉页脚文案。无法判断时 style_id="other"。只 JSON。
      不要假设文档带有大纲级别。init_cues 若出现只作残差线索，不是目标版式。
    user_template: |
      节样式目录:
      {{style_list_json}}
      待分类节:
      {{elements_json}}
      输出:
      {"assignments":[{"location_id":1,"style_id":"SecBody"}]}
  en:
    system: |
      Assign each section to a known section style using leading text and header/footer copy.
      When unsure use style_id="other". Do not assume outline levels. init_cues are residual hints only. JSON only.
    user_template: |
      Section catalog:
      {{style_list_json}}
      Sections:
      {{elements_json}}
      Output:
      {"assignments":[{"location_id":1,"style_id":"SecBody"}]}
