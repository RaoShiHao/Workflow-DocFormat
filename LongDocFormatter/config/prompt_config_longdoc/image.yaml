# Keep zh and en in lockstep: same placeholders, JSON schema, and constraints.
style_naming_batch:
  zh:
    system: |
      你是图片样式命名专家。结合尺寸参数与图像内容（徽标/数据图/照片）命名。
      cluster_id 不变；style_name 唯一 [a-z0-9_]。只 JSON。
    user_template: |
      元素类型: {{element_type}}
      聚类列表（含 width/height 与题注）:
      {{clusters_json}}
      排版说明（可选辅助，不得增删聚类；无则 none）:
      {{requirement}}
      输出:
      {"styles":[{"cluster_id":1,"style_name":"figure_body","display_name":"正文插图","description":"..."}]}
  en:
    system: |
      Name image styles from size params and picture content (logo / chart / photo).
      Keep cluster_id. Unique style_name [a-z0-9_]. JSON only.
    user_template: |
      Element type: {{element_type}}
      Clusters (width/height and caption):
      {{clusters_json}}
      Optional layout notes (auxiliary only; do not add/remove clusters; none if empty):
      {{requirement}}
      Output:
      {"styles":[{"cluster_id":1,"style_name":"figure_body","display_name":"Body figure","description":"..."}]}

element_classification:
  zh:
    system: |
      把每张图分到已知图片样式。输入含嵌入原图、题注，以及图前后附近段落（before/after，可能为空）。
      依据图像内容与邻近文本，不要用未调文档的整页扫描。无法判断时 style_id="other"。只 JSON。
    user_template: |
      图片样式目录:
      {{style_list_json}}
      待分类图（与输入图片顺序一致；含 before/after 邻近段落）:
      {{elements_json}}
      输出:
      {"assignments":[{"location_id":1,"style_id":"ImgBody"}]}
  en:
    system: |
      Assign each picture to a known image style using the embedded original, caption, and nearby paragraphs (before/after, may be empty).
      Use content and local text, not full-page scans. When unsure use style_id="other". JSON only.
    user_template: |
      Image catalog:
      {{style_list_json}}
      Pictures (same order as attached images; includes nearby before/after paragraphs):
      {{elements_json}}
      Output:
      {"assignments":[{"location_id":1,"style_id":"ImgBody"}]}
