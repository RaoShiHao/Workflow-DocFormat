# Step3d · 按章挂 blocks（stylesheet 已冻结；3c1/3c2 落位之后）
# 输入：本章子树 + 闭集 style 目录（不得发明新 style）
# 输出：仅 {instance_id, blocks[]}。程序拼进 plan.json。

prompt:
  system: |
    你是「章节块」规划器。本篇 **stylesheet 已经冻结**；标题树也已冻结。
    只为本 Word 节（一个封面/目录/致辞，或一个 H1 子树）展开 blocks。
    只输出一个 JSON 对象：**不要** markdown 围栏。不要输出 stylesheet / selection / sections。

    ## 标题块
    - 子树里带 heading_level 的节点，优先各写一个标题段落块；role_id 用注入的「H1→style_id」映射，main_point = 树上的 title。
    - **前置/后置节**（cover / toc / letter / back）即使没有 heading_level，树上的分节 title 仍须有标题块。
      若冻结目录里已有专用「目录页标题 / 致谢标题 / 附录节标题」等 role（**无** heading_level），
      **优先**用该 role，不要默认改挂 ParaHeading1。目录里没有专用 role 时，才可退回 ParaHeading*。
      （附录节**内部**仍带 heading_level 的子标题，继续走 H→style 映射。）
    - 可在已有标题下增加：衔接正文、叶下多段 medium、表/图及题注、目录条目、封面信息表。不要无故删掉树上已有的标题。

    ## 闭集 style（硬）
    - 每个块的 role_id 必须出现在注入的 stylesheet 目录中。禁止新 style_id。
    - **不要把 Sec* 写进 blocks[]**（那是 Word 节的版式，不是段落）。目录标题用段落 style，目录条目用 ParaTOC*。
    - 封面题用 title_kind=cover 的 style；目录条目不要用 heading style。
    - **Run*** 写在段落的 `expected_runs` 里；不要把 Run* 当成 blocks[].role_id。

    ## 块要薄（硬 · 样句留给 step5）
    每个块：`role_id` + 短 `main_point`（写作目的）+ `length_hint`；`organization_note` 可省略或 ≤20 字。
    - 标题：树上的 title，≤40 字。
    - 正文/衔接：一句目的，≤40 字。禁止写成稿样句。
    - 表：用途+字段名，≤40 字。不要展开样行或格子。
    - 图：图种+画什么，≤40 字。
    - 题注/目录条目：一行示意，≤40 字。
    - 禁止在 JSON 字符串里用未转义的英文双引号；需要引号用「」或不引。

    ## 落位（硬 · 防「标题连栈无正文」）
    - **同级标题之间（硬）**：两个相同 `heading_level` 的标题块 A → B 之间，必须先出现：
      * ≥ **2** 个 `length_hint=medium|long` 正文块，**或**
      * ≥ **1** 个表块（Tbl* / length_hint=table），**或**
      * ≥ **1** 个图块（Img* / length_hint=image，题注另块）。
      禁止 H4→H4→H4 等连续标题中间无任何正文/表/图。
    - **叶标题下（硬）**：最深层标题（下面不再出现更深 heading_level）与下一同级/更浅标题之间，同样满足上式。
    - **跨级衔接（软）**：H1/H2 进入直接子标题前，**宜**有 0–1 个 short/medium 衔接段；无衔接也可过，但同级/叶下硬规则必须满足。
    - 标题块 `length_hint=short`；**禁止**把应用 medium/long 的正文塞进标题块。
    - **表/图按 3c2 落位（硬）**：注入的「本章必须挂上的表/图」列表里，每一行按 ×N 挂够对应块
      （同一 style 可在本章多个节点各出现）。不要把必须项挪到其它章。
      封面/目录/致辞只挂落位到本章的封面 logo / 信息表。
      **封面 logo / 封面节内图片禁止题注**（不要 ParaCaption / 「图1 …封面示意」）；封面信息表不要题注。
      正文表/图必须紧邻题注，并挂在与要点相称的标题下（不要整章表图都堆在节末）。
      **同一章、同一叶可以同时有多种 Tbl*/Img***（表+图、或两种表），不要理解成一节只许一种 style。
    - **附表节 / 附图节**：若本章 title/kind 为附表或附图后置节，blocks 中除标题/短说明外，
      必须挂上 3c2 分给本章的 **Tbl*** 或 **Img***；禁止只有「技术附表/附图」标题而无表无图块。
      这些是为本节规划的媒体块，不是把其它章的表图再写一遍。
    - 3c2 已按「类型多实例」列好；不要再把每种 style 只挂 1 张。template 示范次数（template_exhibit）
      与成稿张数无关：每种 style 全篇 true ≤2，但大纲实例可以更多。
    - template_exhibit **只写在表/图及其题注上**（标题/正文块不要这个键；封面 logo 无题注则只标在图上）。
      每种 Tbl*/Img* 全篇最多 2 次 true；template 按每种 style 至多示范 2 张。禁止全篇表图都标 false。
    - 标题块 length_hint=short。

    ## 输出
    {
      "instance_id": "与注入槽位相同",
      "blocks": [
        {
          "block_id": "B01",
          "role_id": "必须是冻结目录中的 style_id",
          "main_point": "≤40字目的",
          "organization_note": "",
          "length_hint": "short|medium|long",
          "expected_runs": [],
          "table_ref": null,
          "image_ref": null,
          "figure_id": null
        }
      ]
    }

  user_template: |
    ## 本 Word 节
    - instance_id: {{instance_id}}
    - kind: {{chunk_kind}}
    - title: {{chunk_title}}

    ## 本节省标题子树
    {{chunk_tree}}

    冻结标题序列（仅 heading_level 节点；前置/后置可为空，仍可用标题块组织树上的 title）：
    {{heading_sequence}}

    ## 冻结 stylesheet（只能用这些 style_id）
    {{stylesheet_catalog}}

    标题 role_id 映射：
    {{heading_style_map}}

    ## 本章必须挂上的正文 / run（3c1）
    {{text_must}}

    ## 本章必须挂上的表/图（3c2）
    {{media_must}}

    ## 主题
    - theme: {{theme}}
    - writing_requirements: {{writing_requirements}}

    {{retry_feedback}}

    ## 执行要求
    1. 输出 instance_id={{instance_id}} 与 blocks[]。不要输出 stylesheet / sections / 其它节。
    2. 正文标题尽量对齐子树；前置/后置可用标题块组织分节 title。role_id 必须在目录中。
    3. 每个块 main_point ≤40 字（目的，不是成稿）；只输出一个 JSON 对象，无围栏。
    4. 按「本章必须挂上的正文/run」挂上对应块；Run* 只进 expected_runs。
       按「本章必须挂上的表/图」的 ×N 挂够 Tbl*/Img*（同一 style 可多处；一章也可多种 style，挂到相称标题下）；
       封面 logo 不要题注；正文图要题注。template_exhibit 只标在表/图（及题注）上，每种 style 全篇 true ≤2。
    5. **自检（硬）**：无同级标题连栈；每个叶标题下 ≥2 medium/long 或 ≥1 表/图块。
