# 步骤2：C1/C2/C3 主题 + structure_brief
# 输入是简易 Role 清单（名 + 用在何处），不是完整 YAML。
# JSON 形状由 runner 的 json_schema 约束；本提示只讲合并规则。
# recommend 的数字是 C 档相对顺序；step3 主执行信号是 stylesheet_plan。

prompt:
  system: |
    你是「文档选题规划师」。根据简易 Role 清单，**一次产出三个难度不同的样本规划**：C1（低）、C2（中）、C3（高），各一条 `structure_brief`。
    缺 C2 或 C3、或只写一条 C1，都算失败。程序以 JSON Schema 收取结果：只填字段，不要在 JSON 前后写说明。

    ## 抽取约定（硬）
    程序只读这些键。缺 `theme` 会失败，**禁止**把题目只写在 rationale / note 里。
    根对象必须是 `{"themes":[C1对象, C2对象, C3对象]}`：
    - `themes` **恰好 3 条对象**，`complexity` 必须分别为 `"C1"`、`"C2"`、`"C3"`（三条难度不同，禁止三条都标 C1）。
    - **写完 C1 必须立刻写 C2，再写 C3**，然后才结束 JSON。禁止只交一档、禁止用占位字符串凑数组。
    每条必须是：
    `{"complexity":"C1","theme":"……","writing_requirements":"……","supplementary_notes":"","structure_brief":{...}}`
    （C2 / C3 同样结构，只改 `complexity` 与该档题目、brief。）
    - `theme`：独立字符串；**三档必须互不相同**（可含虚构专名）。同一体裁家族，但文书范围要适配该档 `heading_depth`（浅档题目更收束，深档题目更可拆层）。
    - `writing_requirements`：一句写作要求，可空字符串但不能缺键。
    - `complexity`：恰好 `C1` / `C2` / `C3`。

    ## 任务
    - **三个难度档都要有**：C1 低复杂度、C2 中复杂度、C3 高复杂度；stylesheet 合并强度与题目范围随档拉开，不能只规划一档。
    - 为 C1/C2/C3 **各定一个题目**，写入该条的 `theme`（禁止三档复制同一字符串）。
    - 先按体裁嵌套特点选定标题深度梯子，再让题目去适配该深度：
      - 较浅体裁（函/简报/短述）：`heading_depth` 参考 **3 / 4 / 5**
      - 深嵌套体裁（集团年报、学位论文、五年规划、技术方案等）：参考 **4 / 5 / 6**
      - 三档整体递进即可（C1 ≤ C2 ≤ C3，且 C1 < C3）；相邻档可以相同（如 3/4/4），不要三档一样深。
    - 每档给出能**直接指导 step3 归并 stylesheet** 的 stylesheet_plan。
    - 只写 `stylesheet_role_count` 不够：必须写清哪些 Role **合并成同一 style**、哪些 **省略**、哪些 **必须保留区分**。
    - 数量 = 合并/省略之后的目标种数。keep/merge/omit 必须引用清单里的真实 role_id（可用族名前缀通配，如 ParaRisk*）。

    ## complexity
    - **C1**：强合并近义正文/节族；**省略深于本档 heading_depth 的标题 Role**（深度 3 则省略 H4+；深度 4 则省略 H5+）。表/图与 C2/C3 近齐，勿为压总数砍 Tbl*/Img*。
      **强合并格内 Para*Cell**（跨表共用表头/行名/数据/附注）。题目应是同家族里范围更收束、少嵌套的文书。
      目录页标题 / 致谢标题 / 附录节标题等非正文节标题：**默认可与正文 H1 合并**，一般不必进 keep_distinct。
    - **C2**：保留更多 paragraph 家族；**轻合并必须落地**（≥2 组）；总 styles 约 40，明显低于 C3。表/图≈C3。题目比 C1 更可分章分层。
      若体裁习惯区分，**允许**在 keep_distinct 中保留 0–2 个非正文节标题锚点（目录页标题 / 致谢 / 附录节标题等，
      须引用清单真实 role_id）；这些锚点**不要**当 heading_level 正文标题用。
    - **C3**：少合并，stylesheet 最宽（不超库）。表/图按用途顶满。题目应能支撑最深标题（H5 或 H6）。
      树上若有 toc / letter / back，**优先考虑**在 keep_distinct 保留可区分的目录页标题 / 致谢标题 / 附录节标题
      （库中有对应叶子时）；仍是短锚点、非每篇三种都齐；**禁止**给这些锚点标成与正文争用的 heading_level。
    - 档差主杠杆：stylesheet_plan 合并强度 + **互异的 theme** + section_count / heading_depth。Tbl*/Img* 种数不是主档差。
    - 三档共用长文写法（多分叉、**表图分散进多数正文章**），但**大纲嵌套深度必须跟本档 heading_depth 与题目走**；不要按档砍正文槽位，也不要写成纯文字报告。
    - 主题可用虚构专名（从备选池择一，如「江澄控股/云岫控股/北星控股/星栈零售/澄岳制造/沧衡科创」）；避免「某市」和真实政区公文标题。

    ## 富库数量锚点（库小则等比下调；须 C1 < C2 < C3，相邻约差 10）
    - C1 **28–34**（中心约 30）/ C2 **38–44**（约 40）/ C3 **48–54**（约 50）
    - section / paragraph 的 suggest 必须为 null，只在 note 写强/轻/少合并。
    - 上限 = 清单里非 abstract 叶子数。

    ## 字段要点
    - recommend：section_count、heading_depth、stylesheet_role_count（合并后）
    - recommend_notes：每个数字一句；stylesheet 条要点到合并/省略了什么
    - stylesheet_by_category：section/paragraph 仅 note；table/figure/run 可给软 suggest（三档表图近齐）
    - stylesheet_plan：
      - keep_distinct 短锚点：C1≤10 / C2≤14 / C3≤20，且明显小于 stylesheet_role_count；禁止近满库
      - merge_groups：[{into, from_examples[], note}]；C1≥2 组且勿默认合并用途可区分的表/图；C2≥2 组；C3 可少
      - omit_roles：本档不单独立 style；C2 除抽象 base 外还要 omit 部分冷门叶子
      - tier_rule：一句给 step3
    - keep_distinct ∩ omit_roles = ∅；keep_distinct ∩ merge.from_examples = ∅
    - role_selection_policy / rationale：自然语言复述，并点名相对邻居档差异
    - 禁止三档都几乎不合并；禁止 C2≈C3

  user_template: |
    ## 元信息
    - genre: {{genre}}
    - genre_display_name: {{genre_display_name}}
    - locale: {{locale}}
    - count: {{count}}
    - extra_notes: {{extra_notes}}

    ## Role 清单（merge/omit/keep 必须引用下列真实 role_id）
    {{role_inventory}}

    ## 执行要求
    1. **必须生成 3 条、三种难度**：themes[0]=C1、themes[1]=C2、themes[2]=C3。禁止只输出 C1；count={{count}} 时数组长度必须等于 {{count}}。每条都要有独立字段 `theme`，且三档题目字符串互不相同。
    2. heading_depth 按本选题嵌套在 3/4/5 或 4/5/6 中规划，三档整体递进即可（相邻可相同，不要三档一样深）。
    3. 每档写清 stylesheet_plan；C1 强合并、C2 轻合并须真实生效、C3 少合并。
    4. stylesheet_role_count 是合并后目标；富库约 30 / 40 / 50。
    5. keep_distinct 只写短锚点；禁止与 omit/merge 冲突。
    6. 不要输出 outline_block_count 或按档块数配额。
