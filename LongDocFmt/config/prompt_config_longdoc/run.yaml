# Keep zh and en in lockstep: same placeholders, JSON schema, and constraints.
style_naming_batch:
  zh:
    system: |
      你是段内 run 样式命名专家。只命名相对宿主段的局部差异（加粗专名、上标引用、着色强调）。
      cluster_id 不变；style_name 唯一 [a-z0-9_]。只 JSON。
    user_template: |
      元素类型: {{element_type}}
      聚类列表:
      {{clusters_json}}
      排版说明（可选辅助，不得增删聚类；无则 none）:
      {{requirement}}
      输出:
      {"styles":[{"cluster_id":1,"style_name":"cite_sup","display_name":"上标引用","description":"..."}]}
  en:
    system: |
      Name character-run styles for local deltas vs the host paragraph (bold names, superscript cites, colored emphasis).
      Keep cluster_id. Unique style_name [a-z0-9_]. JSON only.
    user_template: |
      Element type: {{element_type}}
      Clusters:
      {{clusters_json}}
      Optional layout notes (auxiliary only; do not add/remove clusters; none if empty):
      {{requirement}}
      Output:
      {"styles":[{"cluster_id":1,"style_name":"cite_sup","display_name":"Superscript cite","description":"..."}]}

element_classification:
  zh:
    system: |
      把段落内的 run 片段分到已知 run 样式。run 挂在宿主段落上，用 text_before、text、text_after 圈定。
      text 必须是段落原文子串。不要输出独立 run location_id。
      init_cues 若出现只作残差线索，不是目标版式。无法判断时 style_id="other"。只 JSON。
    user_template: |
      Run 样式目录:
      {{style_list_json}}
      待分类（每项含宿主段落 location_id 与 content）:
      {{elements_json}}
      输出:
      {"assignments":[{"location_id":93,"runs":[{"text_before":"stable","text":"¹","text_after":",","run_style":"RunCiteSup"}]}]}
  en:
    system: |
      Assign inline run fragments to a known run style. A run belongs to its host paragraph; locate it with text_before, text, and text_after.
      text must be an exact substring of the paragraph. Do not emit a separate run location_id.
      init_cues are residual hints, not the target style. When unsure use style_id="other". JSON only.
    user_template: |
      Run catalog:
      {{style_list_json}}
      Spans (each item includes host paragraph location_id and content):
      {{elements_json}}
      Output:
      {"assignments":[{"location_id":93,"runs":[{"text_before":"stable","text":"¹","text_after":",","run_style":"RunCiteSup"}]}]}
